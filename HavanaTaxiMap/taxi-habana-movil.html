<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Taxi Habana - Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
}

#map {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

#sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    max-width: 400px;
    background: #fff;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
    transition: max-height 0.3s ease;
}

.sidebar-header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 18px;
    flex-shrink: 0;
}

.sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
}

.search-container {
    padding: 14px;
    background: #f8f9fa;
    flex-shrink: 0;
}

.search-box {
    position: relative;
    margin-bottom: 10px;
}

.search-box:last-child {
    margin-bottom: 0;
}

.search-box .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    z-index: 1;
    pointer-events: none;
}

.search-box input {
    width: 100%;
    padding: 12px 12px 12px 36px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    background: #fff;
    -webkit-appearance: none;
}

.search-box input:focus {
    border-color: #4361ee;
}

.search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    max-height: 180px;
    overflow-y: auto;
    z-index: 1100;
    display: none;
}

.search-results.active {
    display: block;
}

.search-result-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
    line-height: 1.4;
}

.search-result-item:last-child {
    border-bottom: none;
}

.search-result-item:active {
    background: #f0f4ff;
}

.route-info {
    padding: 14px;
    background: #e8f5e9;
    border-top: 2px solid #4caf50;
    flex-shrink: 0;
}

.route-info.hidden {
    display: none;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 14px;
}

.info-row .label {
    color: #555;
    font-weight: 500;
}

.info-row .value {
    color: #222;
    font-weight: 600;
}

.fare-row {
    padding-top: 8px;
    margin-top: 4px;
    border-top: 1px solid #c8e6c9;
}

.fare-row .value.fare {
    color: #2e7d32;
    font-size: 17px;
}

.instructions {
    padding: 14px;
    color: #666;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    flex-shrink: 0;
}

.instructions p {
    margin-bottom: 4px;
}

.instructions.hidden {
    display: none;
}

.action-buttons {
    display: flex;
    gap: 10px;
    padding: 0 14px 14px;
    flex-shrink: 0;
}

.clear-btn, .location-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.clear-btn {
    background: #ef5350;
    color: #fff;
}

.clear-btn:active {
    background: #e53935;
}

.clear-btn.hidden {
    display: none;
}

.location-btn {
    background: #4361ee;
    color: #fff;
}

.location-btn:active {
    background: #3a56d4;
}

#attribution-bar {
    position: fixed;
    bottom: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.85);
    padding: 4px 8px;
    font-size: 10px;
    color: #666;
    z-index: 999;
    border-radius: 4px 0 0 0;
}

#attribution-bar a {
    color: #4361ee;
    text-decoration: none;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Mobile optimizations */
.leaflet-control-zoom {
    display: none;
}

@media (max-width: 480px) {
    #sidebar {
        max-height: 55vh;
    }
}
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Taxi Habana</h1>
        </div>

        <div class="search-container">
            <div class="search-box">
                <span class="icon">&#x1F7E2;</span>
                <input type="text" id="pickup-search" placeholder="Origen" inputmode="search" autocomplete="off">
                <div id="pickup-results" class="search-results"></div>
            </div>
            <div class="search-box">
                <span class="icon">&#x1F534;</span>
                <input type="text" id="dest-search" placeholder="Destino" inputmode="search" autocomplete="off">
                <div id="dest-results" class="search-results"></div>
            </div>
        </div>

        <div id="route-info" class="route-info hidden">
            <div class="info-row">
                <span class="label">Distancia:</span>
                <span id="distance" class="value">--</span>
            </div>
            <div class="info-row">
                <span class="label">Tiempo:</span>
                <span id="duration" class="value">--</span>
            </div>
            <div class="info-row fare-row">
                <span class="label">Tarifa:</span>
                <span id="fare" class="value fare">--</span>
            </div>
        </div>

        <div id="instructions" class="instructions">
            <p>1. Busca o toca el punto de <strong>origen</strong></p>
            <p>2. Busca o toca el punto de <strong>destino</strong></p>
            <p>3. La ruta se calcula automaticamente</p>
        </div>

        <div class="action-buttons">
            <button id="clear-btn" class="clear-btn hidden">Limpiar</button>
            <button id="my-location-btn" class="location-btn">Mi ubicacion</button>
        </div>
    </div>

    <div id="attribution-bar">
        &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">Colaboradores de OpenStreetMap</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
(function () {
    const HAVANA_CENTER = [23.1352, -82.3589];
    const TILE_CDN = 'https://a.basemaps.cartocdn.com/rastertiles/voyager';
    const FARE_PER_KM = 1.50;
    const FARE_BASE = 2.00;

    let map, pickupMarker = null, destMarker = null, routeLine = null;
    let pickupCoords = null, destCoords = null, searchTimeout = null;
    let tileCacheDB = null, tileQueue = [], isProcessingQueue = false;

    function initCacheDB() {
        return new Promise(resolve => {
            try {
                const request = indexedDB.open('HavanaTileCache', 1);
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('tiles')) {
                        db.createObjectStore('tiles', { keyPath: 'key' });
                    }
                };
                request.onsuccess = e => { tileCacheDB = e.target.result; resolve(); };
                request.onerror = () => resolve();
            } catch (e) { resolve(); }
        });
    }

    function getCachedTile(key) {
        return new Promise(resolve => {
            if (!tileCacheDB) { resolve(null); return; }
            try {
                const tx = tileCacheDB.transaction('tiles', 'readonly');
                const req = tx.objectStore('tiles').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            } catch (e) { resolve(null); }
        });
    }

    function cacheTile(key, blob) {
        if (!tileCacheDB) return;
        tileQueue.push({ key, blob });
        if (!isProcessingQueue) processTileQueue();
    }

    function processTileQueue() {
        if (tileQueue.length === 0 || !tileCacheDB) { isProcessingQueue = false; return; }
        isProcessingQueue = true;
        const batch = tileQueue.splice(0, 10);
        try {
            const tx = tileCacheDB.transaction('tiles', 'readwrite');
            batch.forEach(({ key, blob }) => tx.objectStore('tiles').put({ key, blob, timestamp: Date.now() }));
            tx.oncomplete = () => processTileQueue();
            tx.onerror = () => { isProcessingQueue = false; };
        } catch (e) { isProcessingQueue = false; }
    }

    L.TileLayer.CachedTileLayer = L.TileLayer.extend({
        createTile: function(coords, done) {
            const tile = document.createElement('img');
            const key = `${coords.z}/${coords.x}/${coords.y}`;
            tile.onload = () => done(null, tile);

            getCachedTile(key).then(cached => {
                if (cached) {
                    const url = URL.createObjectURL(cached.blob);
                    tile.src = url;
                    tile.onload = () => { URL.revokeObjectURL(url); done(null, tile); };
                    return;
                }
                const cdnUrl = `${TILE_CDN}/${coords.z}/${coords.x}/${coords.y}.png`;
                fetch(cdnUrl)
                    .then(res => res.blob())
                    .then(blob => {
                        cacheTile(key, blob);
                        const url = URL.createObjectURL(blob);
                        tile.src = url;
                        tile.onload = () => { URL.revokeObjectURL(url); done(null, tile); };
                    })
                    .catch(() => { tile.src = cdnUrl; });
            });
            return tile;
        }
    });

    function initMap() {
        map = L.map('map', {
            center: HAVANA_CENTER,
            zoom: 13,
            zoomControl: false,
            preferCanvas: true,
            updateWhenZooming: false,
            updateWhenIdle: true,
            keepBuffer: 4
        });

        new L.TileLayer.CachedTileLayer('', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">Colaboradores de OpenStreetMap</a>',
            maxZoom: 20,
            tileSize: 256
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);
        map.on('click', onMapClick);
    }

    function onMapClick(e) {
        const { lat, lng } = e.latlng;
        if (!pickupCoords) setPickup(lat, lng);
        else if (!destCoords) setDest(lat, lng);
    }

    function createMarker(color, icon) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="background:${color};width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:3px solid #fff;"><span style="transform:rotate(45deg);font-size:14px;">${icon}</span></div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });
    }

    function setPickup(lat, lng) {
        pickupCoords = [lat, lng];
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker([lat, lng], { icon: createMarker('#4caf50', '\u{1F7E2}') }).addTo(map).bindPopup('Origen').openPopup();
        reverseGeocode(lat, lng).then(name => { document.getElementById('pickup-search').value = name; });
        checkAndCalculateRoute();
    }

    function setDest(lat, lng) {
        destCoords = [lat, lng];
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker([lat, lng], { icon: createMarker('#ef5350', '\u{1F534}') }).addTo(map).bindPopup('Destino').openPopup();
        reverseGeocode(lat, lng).then(name => { document.getElementById('dest-search').value = name; });
        checkAndCalculateRoute();
    }

    function checkAndCalculateRoute() {
        if (pickupCoords && destCoords) {
            calculateRoute();
            document.getElementById('route-info').classList.remove('hidden');
            document.getElementById('instructions').classList.add('hidden');
            document.getElementById('clear-btn').classList.remove('hidden');
        }
    }

    function calculateRoute() {
        if (!pickupCoords || !destCoords) return;
        const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (!data.routes || data.routes.length === 0) return;
                const route = data.routes[0];
                const dist = (route.distance / 1000).toFixed(1);
                const dur = Math.ceil(route.duration / 60);
                const fare = (FARE_BASE + (route.distance / 1000) * FARE_PER_KM).toFixed(2);
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.geoJSON(route.geometry, { style: { color: '#4361ee', weight: 5, opacity: 0.8 } }).addTo(map);
                L.featureGroup([pickupMarker, destMarker, routeLine]).getBounds().pad(0.15);
                map.fitBounds(L.featureGroup([pickupMarker, destMarker, routeLine]).getBounds().pad(0.15));
                document.getElementById('distance').textContent = dist + ' km';
                document.getElementById('duration').textContent = dur + ' min';
                document.getElementById('fare').textContent = '$' + fare;
            })
            .catch(err => console.error('Error ruta:', err));
    }

    function searchAddress(query, target) {
        if (query.length < 3) return;
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&countrycodes=cu&viewbox=-82.55,23.3,-82.15,22.9&bounded=1&accept-language=es`;
        fetch(url, { headers: { 'User-Agent': 'TaxiHabana/1.0' } })
            .then(res => res.json())
            .then(results => {
                const container = document.getElementById(target === 'pickup' ? 'pickup-results' : 'dest-results');
                container.innerHTML = '';
                if (results.length === 0) {
                    container.innerHTML = '<div class="search-result-item">No se encontraron resultados</div>';
                    container.classList.add('active');
                    return;
                }
                results.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.textContent = r.display_name;
                    div.addEventListener('touchstart', () => {
                        const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
                        if (target === 'pickup') {
                            setPickup(lat, lon);
                            document.getElementById('pickup-search').value = r.display_name;
                        } else {
                            setDest(lat, lon);
                            document.getElementById('dest-search').value = r.display_name;
                        }
                        container.classList.remove('active');
                    });
                    container.appendChild(div);
                });
                container.classList.add('active');
            })
            .catch(err => console.error('Error busqueda:', err));
    }

    function reverseGeocode(lat, lng) {
        return fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=es`, { headers: { 'User-Agent': 'TaxiHabana/1.0' } })
            .then(res => res.json())
            .then(data => data.display_name || 'Ubicacion seleccionada')
            .catch(() => 'Ubicacion seleccionada');
    }

    function clearAll() {
        if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        pickupCoords = null;
        destCoords = null;
        document.getElementById('pickup-search').value = '';
        document.getElementById('dest-search').value = '';
        document.getElementById('route-info').classList.add('hidden');
        document.getElementById('instructions').classList.remove('hidden');
        document.getElementById('clear-btn').classList.add('hidden');
        map.setView(HAVANA_CENTER, 13);
    }

    function getMyLocation() {
        if (!navigator.geolocation) { alert('Geolocalizacion no disponible'); return; }
        navigator.geolocation.getCurrentPosition(
            pos => { setPickup(pos.coords.latitude, pos.coords.longitude); map.setView([pos.coords.latitude, pos.coords.longitude], 15); },
            () => alert('No se pudo obtener tu ubicacion. Toca el mapa para seleccionar origen.')
        );
    }

    function setupSearch() {
        const pickupInput = document.getElementById('pickup-search');
        const destInput = document.getElementById('dest-search');
        const pickupResults = document.getElementById('pickup-results');
        const destResults = document.getElementById('dest-results');

        ['input', 'keyup'].forEach(evt => {
            pickupInput.addEventListener(evt, e => {
                clearTimeout(searchTimeout);
                const val = e.target.value.trim();
                if (val.length >= 3) searchTimeout = setTimeout(() => searchAddress(val, 'pickup'), 600);
                else pickupResults.classList.remove('active');
            });
            destInput.addEventListener(evt, e => {
                clearTimeout(searchTimeout);
                const val = e.target.value.trim();
                if (val.length >= 3) searchTimeout = setTimeout(() => searchAddress(val, 'dest'), 600);
                else destResults.classList.remove('active');
            });
        });

        document.addEventListener('touchstart', e => {
            if (!e.target.closest('.search-box')) {
                pickupResults.classList.remove('active');
                destResults.classList.remove('active');
            }
        });
    }

    function setupButtons() {
        document.getElementById('clear-btn').addEventListener('click', clearAll);
        document.getElementById('my-location-btn').addEventListener('click', getMyLocation);
    }

    function init() {
        initCacheDB().then(() => { initMap(); setupSearch(); setupButtons(); });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
    </script>
</body>
</html>
