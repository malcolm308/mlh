[theme]
base = "dark"
primaryColor = "#ffc107"
backgroundColor = "#0e1726"
secondaryBackgroundColor = "#16243a"
textColor = "#e8eef6"
font = "sans serif"

[server]
headless = true
# Sirve `web_admin/static/` en `/app/static/`. Lo usa el service worker de las
# notificaciones (sw.js): sin él, Android no puede mostrar notificaciones.
enableStaticServing = true

[browser]
gatherUsageStats = false
