org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental apagado a proposito. En esta maquina (Windows, unidad E:)
# el compilador de Kotlin falla al volcar sus caches .tab en
# build/<plugin>/kotlin/compileReleaseKotlin/cacheable/, con "Could not close
# incremental caches". El daemon se cae, Gradle reintenta y el build se queda
# dando vueltas sin llegar a producir el APK. Compilando sin incremental no se
# escriben esas tablas. El coste es recompilar algo mas, pero el build termina.
kotlin.incremental=false

# La compilacion de Kotlin dentro del propio proceso de Gradle, en vez de en un
# daemon aparte: menos procesos y menos RAM en uso, que aqui es el cuello de
# botella. Requiere que org.gradle.jvmargs tenga heap suficiente.
kotlin.compiler.execution.strategy=in-process

# Un solo modulo a la vez: menos procesos Kotlin vivos a la vez.
org.gradle.parallel=false

# AGP 8.x: sin esto, el optimizador de recursos de release renombra y elimina
# recursos (los del APK salian como res/Ke.png, res/0E.xml, sin res/raw/). Ese
# optimizer es el que arranca el ring de spacebell: como Dart referencia el raw
# solo por nombre de cadena, el recurso se ve "sin uso" y se descarta pese al
# keep.xml. La app va de 80MB, lo que ahorra es irrelevante; el sonido de la
# notificacion tiene que entrar SIEMPRE.
android.enableResourceOptimizations=false